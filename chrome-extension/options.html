<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datamorph 插件设置</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --card: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --card: #27272a;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --accent: #60a5fa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }

      main {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.08);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
        line-height: 1.3;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .setting {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
      }

      .setting-text {
        flex: 1;
        min-width: 0;
      }

      .setting-title {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }

      .setting-desc {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .switch {
        position: relative;
        flex: none;
        width: 44px;
        height: 24px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
        z-index: 1;
      }

      .switch-track {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: var(--border);
        transition: background 150ms ease;
      }

      .switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
        transition: transform 150ms ease;
      }

      .switch input:checked + .switch-track {
        background: var(--accent);
      }

      .switch input:checked + .switch-track::after {
        transform: translateX(20px);
      }

      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .status {
        min-height: 20px;
        margin: 16px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Datamorph 插件设置</h1>
      <p class="subtitle">
        在浏览器直接打开第三方地址、且响应内容为 JSON 时，若 Datamorph
        已打开，会在其中新建标签页展示数据；否则接管当前标签页。
      </p>

      <div class="setting">
        <span class="setting-text">
          <span class="setting-title">自动打开 JSON 页面</span>
          <span class="setting-desc">
            关闭后，第三方 JSON 页面保持浏览器原样显示，不再自动跳转。
          </span>
        </span>
        <label class="switch">
          <input id="auto-open" type="checkbox" />
          <span class="switch-track"></span>
        </label>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="./options.js"></script>
  </body>
</html>
